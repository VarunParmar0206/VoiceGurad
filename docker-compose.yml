services:
  db:
    image: postgres:16
    container_name: voiceguard-postgres
    environment:
      POSTGRES_USER: voiceguard
      POSTGRES_PASSWORD: voiceguard
      POSTGRES_DB: voiceguard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: voiceguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
